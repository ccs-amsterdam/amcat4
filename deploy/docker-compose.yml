services:
  caddy:
    profiles: [deploy, deploy-nodb]
    image: ccsamsterdam/amcat4_frontend:${AMCAT4_VERSION:-latest}
    container_name: katty
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - AMCAT4_URL=${AMCAT4_URL:-http://localhost}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - amcat-net
    depends_on:
      - api

  api:
    profiles: [deploy, deploy-nodb]
    image: ccsamsterdam/amcat4_backend:${AMCAT4_VERSION:-latest}
    container_name: amcat4
    restart: unless-stopped
    networks:
      - amcat-net
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      # For deploy-nodb, set amcat4_postgres_url in .env to point to your own postgres server (with pg_search)
      - amcat4_postgres_url=${amcat4_postgres_url:-postgresql://amcat:${POSTGRES_PASSWORD:-amcat}@db:5432/amcat}
      - amcat4_host=${AMCAT4_URL:-http://localhost}
      - FORWARDED_ALLOW_IPS=*
      # Passthrough environment variables for the API configuration
      - amcat4_postgres_schema
      - amcat4_auth
      - amcat4_middlecat_url
      - amcat4_admin_email

  # PostgreSQL with the pg_search (BM25 full-text search) and pgvector extensions.
  # Consider pinning PARADEDB_VERSION in .env (see https://hub.docker.com/r/paradedb/paradedb/tags)
  db: &db_base
    profiles: [deploy]
    image: paradedb/paradedb:${PARADEDB_VERSION:-latest}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=amcat
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-amcat}
      - POSTGRES_DB=amcat
    # Set POSTGRES_SHARED_BUFFERS in .env to about 25% of available memory
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amcat -d amcat"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - amcat-net
    volumes:
      - ${POSTGRES_DATA_STORAGE:-postgres_data}:/var/lib/postgresql:rw

  db-dev:
    <<: *db_base
    profiles: [dev]
    ports:
      - "127.0.0.1:5432:5432"

  # S3-compatible storage — only used in local dev (run with --profile dev)
  s3:
    profiles: [dev]
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs01
    command:
      [
        "server",
        "-s3",
        "-s3.config=/etc/seaweedfs/s3config.json",
        "-s3.allowEmptyFolder=false",
      ]
    volumes:
      - seaweedfs_data:/data
      - ./deploy/s3config.json:/etc/seaweedfs/s3config.json:ro
    ports:
      - "127.0.0.1:8333:8333" # S3 Gateway
      # - "127.0.0.1:8889:8888" # Web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amcat-net

networks:
  amcat-net:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  seaweedfs_data:
